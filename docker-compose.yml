# Local development: `docker compose up --build`
# Or just the database: `docker compose up db -d`, then run backend/frontend with `npm run dev`.
# Frontend: http://localhost:5173   Backend: http://localhost:4000
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: deployflow
      POSTGRES_PASSWORD: deployflow
      POSTGRES_DB: deployflow
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deployflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: "postgresql://deployflow:deployflow@db:5432/deployflow?schema=public"
      JWT_SECRET: "local-dev-secret-change-me"
      PORT: "4000"
      CORS_ORIGIN: "http://localhost:5173"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: "http://localhost:4000"
    ports:
      - "5173:4173"
    depends_on:
      - backend

volumes:
  db-data:
